name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheStoryNexusTauriApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: TheStoryNexusTauriApp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present

  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheStoryNexusTauriApp/sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheStoryNexusTauriApp/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build tests
        run: cargo test --no-run
      - name: Run tests
        run: cargo test

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheStoryNexusTauriApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: TheStoryNexusTauriApp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --runInBand

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheStoryNexusTauriApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: TheStoryNexusTauriApp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests (web build)
        run: npx playwright test
        env:
          CI: true
